"$schema" = 'https://starship.rs/config-schema.json'

# A blank line before each prompt for breathing room.
add_newline = true

# Cohesive Catppuccin Mocha palette. Vivid enough for dark or light terminals.
palette = "catppuccin_mocha"

# Single-line info, then prompt character on its own line:
#   <directory> <git> <runtimes> <aws> <k8s> <duration>
#   ❯
format = """
$directory\
$git_branch\
$git_status\
$git_state\
$nodejs\
$python\
$golang\
$rust\
$package\
$docker_context\
$aws\
$kubernetes\
$cmd_duration
$jobs$character """

# ─── Palette ──────────────────────────────────────────────────────────────
[palettes.catppuccin_mocha]
rosewater  = "#f5e0dc"
mauve      = "#cba6f7"
red        = "#f38ba8"
peach      = "#fab387"
yellow     = "#f9e2af"
green      = "#a6e3a1"
teal       = "#94e2d5"
sky        = "#89dceb"
sapphire   = "#74c7ec"
blue       = "#89b4fa"
lavender   = "#b4befe"
text       = "#cdd6f4"
subtext1   = "#bac2de"
subtext0   = "#a6adc8"
overlay1   = "#7f849c"
overlay0   = "#6c7086"

# ─── Directory ────────────────────────────────────────────────────────────
[directory]
style              = "bold blue"
format             = "[$path]($style)[$read_only]($read_only_style) "
truncation_length  = 3
truncation_symbol  = "…/"
truncate_to_repo   = true
read_only          = " 󰌾"
read_only_style    = "red"

[directory.substitutions]
"Documents" = "󰈙 Documents"
"Downloads" = " Downloads"

# ─── Git ──────────────────────────────────────────────────────────────────
[git_branch]
symbol = " "  # nf-pl-branch
style  = "mauve"
format = "on [$symbol$branch]($style) "

[git_status]
style      = "yellow"
format     = "([$all_status$ahead_behind]($style))"
conflicted = "[=${count} ](red)"
ahead      = "[⇡${count} ](teal)"
behind     = "[⇣${count} ](teal)"
diverged   = "[⇕ ⇡${ahead_count}⇣${behind_count} ](peach)"
up_to_date = "[✓ ](green)"
untracked  = "[?${count} ](overlay1)"
stashed    = "[\\$${count} ](mauve)"
modified   = "[!${count} ](yellow)"
staged     = "[+${count} ](green)"
renamed    = "[»${count} ](teal)"
deleted    = "[✘${count} ](red)"

[git_state]
style  = "red"
format = '\([$state( $progress_current/$progress_total)]($style)\) '

# ─── Cloud / k8s ──────────────────────────────────────────────────────────
[aws]
symbol = " "  # nf-dev-aws (proper AWS smile logo)
style  = "peach"
format = 'on [$symbol$profile(\($region\))]($style) '

[kubernetes]
symbol   = "\U000F10FE "  # nf-md-kubernetes (U+F10FE)
style    = "sapphire"
format   = 'in [$symbol$context(\($namespace\))]($style) '
disabled = false

# Friendly aliases for long EKS/GKE/AKS context names.
[kubernetes.context_aliases]
"arn:aws:eks:[a-z0-9-]+:[0-9]+:cluster/(?P<cluster>.+)" = "$cluster"
"gke_[^_]+_[a-z0-9-]+_(?P<cluster>[a-z0-9-]+)"          = "$cluster"

# ─── Language runtimes (only show in relevant projects) ───────────────────
[golang]
symbol = " "  # nf-dev-go (gopher)
style  = "sky"
format = "via [$symbol$version]($style) "

[nodejs]
symbol = " "  # nf-dev-nodejs_small (Node hexagon)
style  = "green"
format = "via [$symbol$version]($style) "

[python]
symbol = " "  # nf-dev-python
style  = "yellow"
format = 'via [$symbol${pyenv_prefix}${version}(\($virtualenv\))]($style) '

[rust]
symbol = " "  # nf-dev-rust (gear)
style  = "peach"
format = "via [$symbol$version]($style) "

[package]
symbol   = "󰏗 "  # nf-md-package_variant_closed
style    = "lavender"
format   = "is [$symbol$version]($style) "
disabled = false

# ─── Misc ─────────────────────────────────────────────────────────────────
[cmd_duration]
min_time           = 2_000
style              = "overlay1"
format             = "took [󰔚 $duration]($style) "
show_milliseconds  = false

[jobs]
symbol           = "✦ "
style            = "yellow"
number_threshold = 1
format           = "[$symbol$number ]($style)"

[character]
success_symbol = "[❯](bold green)"
error_symbol   = "[❯](bold red)"
vimcmd_symbol  = "[❮](bold green)"

# ─── Silence noise we don't use ───────────────────────────────────────
[lua]
disabled = true
[ruby]
disabled = true
[haskell]
disabled = true

[docker_context]
symbol          = " "  # nf-dev-docker (whale)
style           = "blue"
format          = "via [$symbol$context]($style) "
only_with_files = true
